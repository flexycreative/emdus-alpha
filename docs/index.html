<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EMDUS Alpha · Test</title>
<style>
body{background:#0b0c0e;color:#e8eaed;font-family:monospace;margin:0;padding:16px;font-size:14px;line-height:1.6}
h1{font-size:16px;color:#ffa21a;margin:0 0 16px}
.box{background:#15171a;border:1px solid #2a2e33;border-radius:4px;padding:12px;margin-bottom:12px}
.lbl{color:#9aa1a9;font-size:11px;letter-spacing:.06em;margin-bottom:6px;text-transform:uppercase}
.val{font-size:14px;word-break:break-all}
.ok{color:#3ddc97}.err{color:#ff6470}.wait{color:#ffb547}
</style>
</head>
<body>
<h1>EMDUS ALPHA · TEST</h1>

<div class="box">
  <div class="lbl">1. Token Listesi</div>
  <div id="t1" class="val wait">Test ediliyor...</div>
</div>

<div class="box">
  <div class="lbl">2. Klines (PEPE örneği)</div>
  <div id="t2" class="val wait">Bekliyor...</div>
</div>

<div class="box">
  <div class="lbl">3. Taker Buy Analizi</div>
  <div id="t3" class="val wait">Bekliyor...</div>
</div>

<script type="module">
const HOST = 'https://www.binance.com';
const $ = id => document.getElementById(id);

async function test1() {
  try {
    const res = await fetch(HOST + '/bapi/defi/v1/public/wallet-direct/buw/wallet/cex/alpha/all/token/list', {cache:'no-store'});
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    if (!j || j.success === false) throw new Error((j&&j.message)||'API gecersiz');
    const list = Array.isArray(j.data) ? j.data : [];
    if (!list.length) throw new Error('Bos liste');
    const sample = list.slice(0,3).map(function(x){
      const rawSym = String(x.symbol||'').toUpperCase();
      const id = x.alphaId || x.alpha_id || x.tokenId || x.id;
      return (x.name||'?') + ' [' + rawSym + '] id=' + id;
    }).join(' | ');
    $('t1').innerHTML = '<span class="ok">BASARILI</span><br>Toplam: <b>' + list.length + '</b> token<br><small style="color:#9aa1a9">Ornek: ' + sample + '</small>';
    return list;
  } catch (e) {
    $('t1').innerHTML = '<span class="err">HATA: ' + e.message + '</span><br><small style="color:#9aa1a9">CORS veya ag sorunu olabilir.</small>';
    return null;
  }
}

async function test2() {
  try {
    const listRes = await fetch(HOST + '/bapi/defi/v1/public/wallet-direct/buw/wallet/cex/alpha/all/token/list', {cache:'no-store'});
    const listJ = await listRes.json();
    const list = Array.isArray(listJ.data) ? listJ.data : [];
    const pepe = list.find(function(x){ return String(x.symbol||'').toUpperCase() === 'PEPE'; });
    if (!pepe) { $('t2').innerHTML = '<span class="err">PEPE token listede bulunamadi</span>'; return null; }
    const id = pepe.alphaId || pepe.alpha_id || pepe.tokenId || pepe.id;
    const quote = String(pepe.quoteAsset||'USDT').toUpperCase();
    const sym = 'ALPHA_' + id + quote;
    const url = HOST + '/bapi/defi/v1/public/alpha-trade/klines?symbol=' + encodeURIComponent(sym) + '&interval=1h&limit=200';
    const res = await fetch(url, {cache:'no-store'});
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    if (!j || j.success === false) throw new Error((j&&j.message)||'API gecersiz');
    const arr = Array.isArray(j.data) ? j.data : (Array.isArray(j) ? j : []);
    if (!arr.length) throw new Error('Bos klines');
    $('t2').innerHTML = '<span class="ok">BASARILI</span><br>Sembol: <b>' + sym + '</b><br>Bar sayisi: <b>' + arr.length + '</b>';
    return arr;
  } catch (e) {
    $('t2').innerHTML = '<span class="err">HATA: ' + e.message + '</span>';
    return null;
  }
}

async function test3() {
  const arr = await test2();
  if (!arr) { $('t3').innerHTML = '<span class="err">Klines alinamadi</span>'; return; }
  const last = arr[arr.length - 1];
  const t = +last[0], v = +last[5], tb = +last[9];
  const sell = v - tb;
  const delta = tb - sell;
  const delta2 = 2*tb - v;
  $('t3').innerHTML =
    'Son bar: ' + new Date(t).toLocaleString('tr-TR') + '<br>' +
    'Toplam hacim (k[5]): <b>' + v + '</b><br>' +
    'Taker buy (k[9]): <b>' + tb + '</b><br>' +
    'Taker sell (v-tb): <b>' + sell + '</b><br>' +
    'Delta (tb-sell): <b>' + delta + '</b><br>' +
    'Delta kontrol (2tb-v): <b>' + delta2 + '</b><br>' +
    (tb === v ? '<span class="err">UYARI: takerBuy = volume (Alpha bugu)</span>' : '<span class="ok">OK: takerBuy farkli (gercek ayrim var)</span>');
}

test1();
test3();
</script>
</body>
</html>
