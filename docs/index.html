<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EMDUS Alpha</title>
<style>
body{background:#0b0c0e;color:#e8eaed;font-family:monospace;margin:0;padding:12px;font-size:13px}
h1{font-size:15px;color:#ffa21a;margin:0 0 10px}
#sw{position:relative;margin-bottom:8px}
input,select{background:#15171a;color:#fff;border:1px solid #2a2e33;padding:10px;font-size:16px;width:100%;border-radius:3px;box-sizing:border-box}
#results{position:absolute;top:100%;left:0;right:0;margin-top:2px;background:#15171a;border:1px solid #2a2e33;max-height:60vh;overflow:auto;-webkit-overflow-scrolling:touch;z-index:50;border-radius:3px;box-shadow:0 4px 12px rgba(0,0,0,.6)}
#results>div{padding:12px;border-bottom:1px solid #24282d;cursor:pointer}
#results>div:active{background:#ffa21a;color:#111}
#results .cnt{padding:6px 10px;font-size:11px;color:#9aa1a9;background:#0b0c0e;position:sticky;top:0;border-bottom:1px solid #24282d;z-index:1}
table{width:100%;border-collapse:collapse;background:#15171a;border:1px solid #2a2e33;margin-top:8px}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid #24282d}
th:first-child,td:first-child{text-align:left}
th{color:#9aa1a9;font-size:11px}
.p{color:#3ddc97}.n{color:#ff6470}.na{color:#9aa1a9}
#err{color:#ff6470;margin:8px 0;font-size:12px;min-height:20px;line-height:1.4;word-break:break-word}
</style>
</head>
<body>
<h1>EMDUS ALPHA</h1>
<div id="sw">
  <input id="search" placeholder="Coin ara (PEPE, BTC, SOL...)" autocomplete="off" autocapitalize="characters">
  <div id="results" hidden></div>
</div>
<select id="interval"></select>
<div id="err"></div>
<table id="tbl"><tr><td class="na" colspan="4">Coin seçin</td></tr></table>
<script type="module">
const KEY='ory_at_JQ5gyIeUfz3K3hQR1d8J-wCABSs4YIBPs0h5aTJzBfg.4IFGicm7D7DhS05lij7EMNhJIxTkJ3jMVmElYmBEsQQ';
const URL='https://streaming.bitquery.io/graphql';
const $=id=>document.getElementById(id);
const up=s=>String(s||'').toLocaleUpperCase('en-US').replace(/İ/g,'I');
let currentBase='PEPE';

const TOKENS = [
  {base:'PEPE', name:'Pepe (SOL)', chainId:'CT_501', contract:'PEPEqnuuCDbBC89p1u9vpnP1KQ2oj1xTcQBsjt9X55m'},
  {base:'BTC',  name:'Bitcoin (BSC)', chainId:'CT_195', contract:'0x7130d2a12b9bcbfae4f2634d864a1ee1ce3ead9c'},
  {base:'ETH',  name:'Ethereum (BSC)', chainId:'CT_195', contract:'0x2170ed0880ac9a755fd29b2688956bd959f933f8'},
  {base:'BNB',  name:'BNB (BSC)', chainId:'CT_195', contract:'0xbb4cdb9cbd36b01bd1cbaebf2de08d9173bc095c'},
  {base:'SOL',  name:'Solana', chainId:'CT_501', contract:'So11111111111111111111111111111111111111112'},
  {base:'DOGE', name:'Dogecoin (BSC)', chainId:'CT_195', contract:'0xba2ae424d960c26247dd6c32edc70b295c744c43'},
  {base:'SHIB', name:'Shiba (BSC)', chainId:'CT_195', contract:'0x2859e4544c4bb03966803b044a93563bd2d0dd4d'},
  {base:'XRP',  name:'XRP (BSC)', chainId:'CT_195', contract:'0x1d2f0da169ceb9fc7b3144628db156f3f6c60dbe'},
  {base:'ADA',  name:'Cardano (BSC)', chainId:'CT_195', contract:'0x3ee2200efb3400fabb9aacf31297cbdd1d435d47'},
  {base:'LTC',  name:'Litecoin (BSC)', chainId:'CT_195', contract:'0x4338665cbb7b2485a8855a139b75d5e34ab0db94'},
  {base:'DOT',  name:'Polkadot (BSC)', chainId:'CT_195', contract:'0x7083609fce4d1d8dc0c979aab8c869ea2c873402'},
  {base:'LINK', name:'Chainlink (BSC)', chainId:'CT_195', contract:'0xf8a0bf9cf54bb92f17374d9e9a321e6a111a51bd'},
  {base:'MATIC', name:'Polygon (BSC)', chainId:'CT_195', contract:'0xcc42724c6683b7e57334c4e856f4c9965ed682bd'},
  {base:'AVAX', name:'Avalanche (BSC)', chainId:'CT_195', contract:'0x1ce0c2827e2ef14d5c4f29a091d735a204794041'},
  {base:'UNI',  name:'Uniswap (BSC)', chainId:'CT_195', contract:'0xbf5140a22578168fd562dccf235e5d43a02ce9b1'},
  {base:'ATOM', name:'Cosmos (BSC)', chainId:'CT_195', contract:'0x0eb3a705fc54725037cc9e008bdede697f62f335'},
  {base:'TRX',  name:'TRON (BSC)', chainId:'CT_195', contract:'0x85eac5ac2f758618dfa09bdbe0cf174e7d574d5b'}
];

function fmt(x){
  if(x==null||isNaN(x))return'—';
  const a=Math.abs(x),f=y=>(Math.round(y*10)/10);
  if(a>=1e9)return f(x/1e9)+'B';
  if(a>=1e6)return f(x/1e6)+'M';
  if(a>=1e3)return f(x/1e3)+'K';
  return f(x);
}

function networkOf(c){
  c=String(c||'').toUpperCase();
  if(c==='CT_501')return 'solana';
  if(c==='CT_195'||c==='56')return 'bsc';
  if(c==='CT_1'||c==='1')return 'eth';
  if(c==='CT_137'||c==='137')return 'polygon';
  if(c==='CT_8453'||c==='8453')return 'base';
  if(c==='CT_42161'||c==='42161')return 'arbitrum';
  return null;
}

async function bq(network, token, limit){
  let q, vars;
  if(network === 'solana'){
    q = 'query($t:String!,$l:Int!){Solana(dataset:realtime){DEXTradeByTokens(limit:{count:$l},orderBy:{descending:Block_Time},where:{Trade:{Currency:{MintAddress:{is:$t}}}}){Block{Time}Transaction{Hash}Trade{AmountInUSD Side{Type}}}}}';
    vars = {t: token, l: limit};
  } else {
    q = 'query($n:evm_network!,$t:String!,$l:Int!){EVM(network:$n,dataset:realtime){DEXTradeByTokens(limit:{count:$l},orderBy:{descending:Block_Time},where:{Trade:{Currency:{SmartContract:{is:$t}}}}){Block{Time}Transaction{Hash}Trade{AmountInUSD Side{Type}}}}}';
    vars = {n: network, t: token, l: limit};
  }
  const r = await fetch(URL, {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + KEY},
    body: JSON.stringify({query: q, variables: vars})
  });
  if(!r.ok){
    const txt = await r.text();
    throw new Error('HTTP ' + r.status + ': ' + txt.slice(0, 200));
  }
  const j = await r.json();
  if(j.errors) throw new Error(j.errors[0].message);
  const rows = (network === 'solana' ? j.data?.Solana?.DEXTradeByTokens : j.data?.EVM?.DEXTradeByTokens) || [];
  const seen = new Set();
  const result = [];
  for(const x of rows){
    const t = new Date(x.Block?.Time).getTime();
    const u = parseFloat(x.Trade?.AmountInUSD || 0);
    const s = String(x.Trade?.Side?.Type || '').toLowerCase();
    const hash = String(x.Transaction?.Hash || '');
    if(!(t > 0) || !(u > 0)) continue;
    if(s !== 'buy' && s !== 'sell') continue;
    const key = t + '|' + hash + '|' + s + '|' + u.toFixed(8);
    if(seen.has(key)) continue;
    seen.add(key);
    result.push({t, b: s === 'buy' ? u : 0, s: s === 'sell' ? u : 0});
  }
  return result;
}

async function load(base){
  $('err').textContent = 'Yükleniyor...';
  $('err').style.color = '#ffb547';
  try{
    const tok = TOKENS.find(t => t.base === base);
    if(!tok) throw new Error('Coin bulunamadı: ' + base);
    currentBase = tok.base;
    const net = networkOf(tok.chainId);
    if(!net) throw new Error('Zincir: ' + tok.chainId);
    const trades = await bq(net, tok.contract, 1000);
    if(!trades.length) throw new Error('İşlem yok: ' + net + ' (' + tok.contract.slice(0, 10) + '...)');
    const iv = {'1m':60000, '5m':300000, '15m':900000, '1h':3600000, '4h':14400000, '1d':86400000}[$('interval').value] || 3600000;
    const m = new Map();
    for(const x of trades){
      const k = Math.floor(x.t / iv) * iv;
      if(!m.has(k)) m.set(k, {b: 0, s: 0});
      const o = m.get(k);
      o.b += x.b;
      o.s += x.s;
    }
    const arr = [...m.entries()].sort((a, b) => b[0] - a[0]).map(([t, o]) => ({t, d: o.b - o.s, v: o.b + o.s}));
    if(arr.length < 2) throw new Error('Yetersiz bar (' + arr.length + ')');
    let h = '<tr><th>BAR</th><th>TAKAS</th><th>MAX</th><th>AD%</th></tr>';
    for(const n of [1, 5, 10, 14, 20, 50, 100, 200]){
      let sum = 0, mx = null, vs = 0;
      for(let i = 0; i < Math.min(n, arr.length); i++){
        sum += arr[i].d;
        vs += arr[i].v;
        if(mx === null || sum > mx) mx = sum;
      }
      const ad = vs > 0 ? sum / vs * 100 : 0;
      const c = sum >= 0 ? 'p' : 'n';
      h += '<tr><td>' + n + '</td><td class="' + c + '">' + fmt(sum) + '</td><td class="' + c + '">' + fmt(mx) + '</td><td class="' + c + '">' + (Math.round(ad * 10) / 10) + '%</td></tr>';
    }
    $('tbl').innerHTML = h;
    $('err').textContent = '✓ ' + trades.length + ' işlem · ' + arr.length + ' bar · ' + net.toUpperCase() + ' · ' + tok.base;
    $('err').style.color = '#3ddc97';
  } catch(e){
    $('err').textContent = e.message;
    $('err').style.color = '#ff6470';
  }
}

function showCoins(q){
  const query = up(q).trim();
  const list = query ? TOKENS.filter(t => t.base.includes(query) || up(t.name).includes(query)) : TOKENS;
  if(!list.length){
    $('results').innerHTML = '<div style="padding:12px;color:#9aa1a9">Sonuç yok</div>';
    $('results').hidden = false;
    return;
  }
  let html = '<div class="cnt">' + list.length + ' coin · ' + (query ? 'filtre: ' + query : 'tümü') + '</div>';
  for(const t of list){
    html += '<div data-b="' + t.base + '"><b>' + t.base + '</b> <small style="color:#9aa1a9">' + t.name + '</small></div>';
  }
  $('results').innerHTML = html;
  $('results').hidden = false;
}

$('search').addEventListener('focus', () => showCoins($('search').value));
$('search').addEventListener('input', () => showCoins($('search').value));
$('search').addEventListener('click', () => showCoins($('search').value));
$('results').addEventListener('click', e => {
  const d = e.target.closest('div[data-b]');
  if(!d) return;
  $('search').value = d.dataset.b;
  $('results').hidden = true;
  load(d.dataset.b);
});
document.addEventListener('click', e => {
  if(!e.target.closest('#sw')) $('results').hidden = true;
});

['1m','5m','15m','1h','4h','1d'].forEach(x => {
  const o = document.createElement('option');
  o.value = x;
  o.textContent = x;
  $('interval').appendChild(o);
});
$('interval').value = '1h';
$('interval').addEventListener('change', () => load(currentBase));

load('PEPE');
</script>
</body>
</html>
