<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0c10">
<title>EMDUS Alpha · Takas</title>
<style>
:root{--bg:#0b0c0e;--panel:#15171a;--alt:#1a1d21;--line:#24282d;--frame:#2a2e33;--fg:#e8eaed;--sub:#9aa1a9;--amb:#ffa21a;--g:#3ddc97;--r:#ff6470;--gbg:#123524;--rbg:#3a161b;--y:#ffb547}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;font-variant-numeric:tabular-nums}
main{max-width:520px;margin:0 auto;padding:14px 12px}
header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
h1{font-size:15px;margin:0;letter-spacing:.04em;color:var(--amb)}
.clock{font-size:12px;color:var(--fg)}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.controls label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.06em}
select{background:var(--panel);color:var(--fg);border:1px solid var(--frame);border-radius:3px;padding:8px;font:inherit;font-size:16px;width:100%}
.pickbtn{background:var(--panel);color:var(--fg);border:1px solid var(--frame);border-radius:3px;padding:8px;font:inherit;font-size:16px;width:100%;text-align:left;cursor:pointer;font-family:inherit}
.pickbtn:active{background:var(--alt)}
.err{color:var(--r);margin:10px 0;white-space:pre-wrap}
.box{background:var(--panel);border:1px solid var(--frame);margin-bottom:12px}
.band{background:var(--amb);color:#111;font-weight:800;padding:5px 9px;font-size:12px;letter-spacing:.08em;display:flex;justify-content:space-between}
.band #price{font-weight:400;font-size:11px}
table{width:100%;border-collapse:collapse}
th{color:var(--sub);font-weight:500;font-size:10.5px;letter-spacing:.08em;text-align:right;padding:5px 9px}
td{padding:4px 9px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tbody tr:nth-child(even){background:var(--alt)}
.p{color:var(--g)} .n{color:var(--r)} .na{color:var(--sub)} .a{color:var(--y)}
.lbl{color:var(--sub);letter-spacing:.04em}
tr.mb{background:var(--gbg)!important} tr.mbn{background:var(--rbg)!important}
.blk{display:inline-block;height:12px;vertical-align:middle}
.wide{text-align:center!important}
.src{color:var(--sub);font-size:10.5px;letter-spacing:.1em;text-align:center;padding:5px 8px;line-height:1.5}
#cvd{display:block;width:100%;height:220px}
.cvdinfo{font-size:12px;color:var(--sub);padding:6px 9px}
[hidden]{display:none!important}

/* MODAL */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:1000;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto}
.modal[hidden]{display:none!important}
.modal-box{background:var(--panel);border:1px solid var(--frame);border-radius:6px;width:100%;max-width:480px;display:flex;flex-direction:column;max-height:90vh;margin:auto 0}
.modal-head{display:flex;gap:6px;padding:10px;border-bottom:1px solid var(--line);align-items:center}
.modal-head input{flex:1;background:var(--bg);color:var(--fg);border:1px solid var(--frame);border-radius:3px;padding:10px;font:inherit;font-size:16px}
.modal-head button{background:var(--alt);color:var(--fg);border:1px solid var(--frame);border-radius:3px;padding:10px 14px;font:inherit;font-size:16px;cursor:pointer}
.modal-head button:active{background:var(--amb);color:#111}
.picklist{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
.pickitem{padding:14px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:baseline;touch-action:manipulation;-webkit-tap-highlight-color:rgba(255,162,26,.3)}
.pickitem:active{background:var(--amb);color:#111}
.pickitem b{font-weight:700}
.pickitem small{color:var(--sub);font-size:11px}
.pickitem:active small{color:#333}
</style>
</head>
<body>
<main>
<header><h1>EMDUS ALPHA · TAKAS</h1><span class="clock" id="clock">--:--:--</span></header>
<div class="controls">
  <label>Coin
    <input id="symbol" type="hidden" value="PEPE">
    <button id="pickBtn" type="button" class="pickbtn">PEPE ▾</button>
  </label>
  <label>Zaman dilimi <select id="interval"></select></label>
</div>
<div id="err" class="err"></div>
<div class="box">
  <div class="band"><span>TAKAS</span><span id="price"></span></div>
  <table id="tbl"></table>
  <table id="supply"></table>
  <div id="src" class="src"></div>
</div>
<div class="box">
  <div class="band"><span>CVD · EMA20/50</span></div>
  <canvas id="cvd"></canvas>
  <div id="cvdinfo" class="cvdinfo"></div>
  <table id="mtf"></table>
</div>
<div class="box">
  <div class="band"><span>ALPHA · ZİNCİR ÜSTÜ</span></div>
  <table id="chain"></table>
</div>
</main>

<div id="pickModal" class="modal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <input id="pickSearch" placeholder="Coin ara…" autocomplete="off" spellcheck="false" autocapitalize="characters">
      <button id="pickClose" type="button">✕</button>
    </div>
    <div id="pickList" class="picklist"></div>
  </div>
</div>

<script type="module">
import { AlphaRegistry } from './alpha.js';

const $ = id => document.getElementById(id);
const up = s => String(s||'').toLocaleUpperCase('en-US').replace(/İ/g,'I');
const fmtVol = x => { if (x==null || Number.isNaN(x)) return '—'; const a=Math.abs(x), r1=y=>(Math.round(y*10)/10).toFixed(1).replace(/\.?0+$/,''); if(a>=1e12)return r1(x/1e12)+'T'; if(a>=1e9)return r1(x/1e9)+'B'; if(a>=1e6)return r1(x/1e6)+'M'; if(a>=1e3)return r1(x/1e3)+'K'; return r1(x); };
const fmtPct = x => x==null ? '—' : (Math.round(x*10)/10)+'%';
const cls = p => p==null ? 'na' : p ? 'p' : 'n';
const pos = x => x==null ? null : x>=0;
const fmtUsd = x => x==null ? '—' : (x<0?'-$':'$')+fmtVol(Math.abs(x));

const ALPHA = new AlphaRegistry({ storage: { get: k=>localStorage.getItem(k), set:(k,v)=>localStorage.setItem(k,v) } });

const HOST = 'https://www.binance.com';
async function getKlines(full, interval, limit=500) {
  const url = `${HOST}/bapi/defi/v1/public/alpha-trade/klines?symbol=${encodeURIComponent(full)}&interval=${interval}&limit=${limit}`;
  const r = await fetch(url, {cache:'no-store'});
  if (!r.ok) throw new Error('Kline: HTTP '+r.status);
  const j = await r.json();
  if (!j || j.success === false) throw new Error('Kline: '+((j&&j.message)||'yanıt geçersiz'));
  const arr = Array.isArray(j.data) ? j.data : (Array.isArray(j) ? j : []);
  return arr.map(k => ({ t:+k[0], o:+k[1], h:+k[2], l:+k[3], c:+k[4], v:+k[5], tb:+k[9] }));
}

function dcuOf(b) {
  const buy  = b.tb;
  const sell = b.v - b.tb;
  return { buy, sell, dcu: buy - sell };
}
function windowStats(deltas, vols, n) {
  if (n<=0 || n>deltas.length) return [null,null,null];
  let total=0, mx=null, vsum=0;
  for (let i=0;i<n;i++){ total+=deltas[i]; vsum+=vols[i]; if (mx===null||total>mx) mx=total; }
  return [total, mx, vsum>0 ? total/vsum*100 : 0];
}
function emaArr(x,n){ const a=2/(n+1), o=new Array(x.length); for(let i=0;i<x.length;i++) o[i]=i===0?x[0]:a*x[i]+(1-a)*o[i-1]; return o; }
function cvdSeries(bars){
  const cvd=[]; let s=0;
  bars.forEach(b=>{ s+=dcuOf(b).dcu; cvd.push(s); });
  return { t:bars.map(b=>b.t), cvd, e20:emaArr(cvd,20), e50:emaArr(cvd,50) };
}

async function compute(token, interval, wins, mbIndex, avgLen) {
  const bars = await getKlines(token.full, interval, 500);
  if (!bars.length) throw new Error('Bu coin için '+interval+' verisi yok.');
  const br = bars.slice().reverse();
  const dcuArr = br.map(dcuOf);
  const vols   = br.map(b=>b.v);
  const deltas = dcuArr.map(x=>x.dcu);
  const buys   = dcuArr.map(x=>x.buy);
  const sells  = dcuArr.map(x=>x.sell);

  const rows = wins.map(n => {
    const [t,m,a] = windowStats(deltas, vols, n);
    return { bar:String(n), takas:t, max:m, ad:a };
  });
  const mbN = wins[mbIndex], mbVal = rows[mbIndex].takas;

  const k = Math.min(mbN, br.length);
  let bt=0, st=0;
  for (let i=0;i<k;i++){ bt+=buys[i]; st+=sells[i]; }
  const flow = bt+st, buyPct = flow>0 ? bt/flow*100 : 50;
  const buyInt = Math.round(buyPct), blocks = 6, buyBlocks = Math.round(buyPct/100*blocks);

  const al = Math.min(avgLen, vols.length);
  let vs=0; for (let i=0;i<al;i++) vs+=vols[i];
  const avgVol = al>0 ? vs/al : null;

  let volPct = null;
  try {
    const d = interval==='1d' ? bars : await getKlines(token.full, '1d', 2);
    if (d.length>=2) {
      const pc = d[d.length-2].c, cur = d[d.length-1];
      const tr = Math.max(cur.h, pc) - Math.min(cur.l, pc);
      volPct = cur.c>0 ? tr/cur.c*100 : null;
    }
  } catch(e){ volPct = null; }

  let month=null, week=null;
  if (interval==='1d') {
    const now = new Date();
    const y = now.getUTCFullYear(), mo = now.getUTCMonth();
    const endM = Date.UTC(mo===11?y+1:y, mo===11?0:mo+1, 1), startM = Date.UTC(y, mo, 1);
    const mDays = Math.floor(Math.max(endM-now.getTime(),0)/86400000);
    const passedM = Math.max(Math.floor((endM-startM)/86400000)-mDays, 0);
    const [ms,,ma] = passedM>0 ? windowStats(deltas,vols,passedM) : [0,null,0];
    month = {days: mDays+'D', takas: ms, ad: ma};
    const dow = (now.getUTCDay()+6)%7;
    const weekStart = Date.UTC(y, mo, now.getUTCDate()-dow);
    const wDays = Math.floor(Math.max(weekStart+7*86400000-now.getTime(),0)/86400000);
    const passedW = Math.max(7-wDays, 0);
    const [ws,,wa] = passedW>0 ? windowStats(deltas,vols,passedW) : [0,null,0];
    week = {days: wDays+'D', takas: ws, ad: wa};
  }

  return {
    token, price: bars[bars.length-1].c, rows, month, week,
    volPct, avgVol, liveVol: vols[0], livePos: deltas[0]>=0,
    mbVal, buyInt, sellInt:100-buyInt, buyBlocks, sellBlocks: blocks-buyBlocks,
    cvd: cvdSeries(bars), nbars: bars.length, mbN
  };
}

function render(d) {
  let h = '<tr><th>BAR</th><th>TAKAS</th><th>MAX</th><th>AD%</th></tr>';
  d.rows.forEach(r => {
    h += `<tr><td>${r.bar}</td><td class="${cls(pos(r.takas))}">${fmtVol(r.takas)}</td><td class="${cls(pos(r.max))}">${fmtVol(r.max)}</td><td class="${cls(pos(r.ad))}">${fmtPct(r.ad)}</td></tr>`;
  });
  if (d.month) {
    h += `<tr><td>AY</td><td>${d.month.days}</td><td class="${cls(pos(d.month.takas))}">${fmtVol(d.month.takas)}</td><td class="${cls(pos(d.month.ad))}">${fmtPct(d.month.ad)}</td></tr>`;
    h += `<tr><td>HAFTA</td><td>${d.week.days}</td><td class="${cls(pos(d.week.takas))}">${fmtVol(d.week.takas)}</td><td class="${cls(pos(d.week.ad))}">${fmtPct(d.week.ad)}</td></tr>`;
  }
  const vp = d.volPct==null ? '—' : (Math.round(d.volPct*100)/100).toString()+'%';
  h += `<tr><td class="lbl" colspan="3">VOLATİLİTE</td><td class="a">${vp}</td></tr>`;
  h += `<tr><td class="lbl" colspan="3">ORT. HACİM</td><td>${fmtVol(d.avgVol)}</td></tr>`;
  h += `<tr><td class="lbl" colspan="3">ANLIK HACİM</td><td class="${d.livePos?'p':'n'}">${fmtVol(d.liveVol)}</td></tr>`;
  const mp = pos(d.mbVal);
  h += `<tr class="${mp===false?'mbn':'mb'}"><td class="lbl" colspan="3">MARKET BASKISI</td><td class="${cls(mp)}">${fmtVol(d.mbVal)}</td></tr>`;
  const bw = Math.round(d.buyInt*0.9), sw = 90-bw;
  h += `<tr><td class="p">${d.buyInt}%</td><td colspan="2" class="wide"><span class="blk" style="background:var(--g);width:${bw}px"></span>&nbsp;<span class="blk" style="background:var(--r);width:${sw}px"></span></td><td class="n">${d.sellInt}%</td></tr>`;
  $('tbl').innerHTML = h;

  let s = '';
  if (d.token.supply) {
    const mx = d.rows[d.rows.length-1]?.max;
    s += `<tr><td class="lbl" colspan="3">Dolaşımdaki miktar</td><td>${fmtVol(d.token.supply)} ${d.token.base}</td></tr>`;
    if (mx != null) s += `<tr><td class="lbl" colspan="3">Birikim (MAX/dolaşım)</td><td class="${cls(pos(mx))}">${fmtPct(mx/d.token.supply*100)}</td></tr>`;
  }
  $('supply').innerHTML = s;
  $('src').textContent = `GERÇEK VERİ AKIŞI: ${d.nbars} BAR · ${d.token.full}`;
  $('price').textContent = d.token.base + ' · ' + d.price;
  drawCvd(d.cvd); renderCvdInfo(d.cvd);
}

function drawCvd(c) {
  const cv = $('cvd'), dpr = window.devicePixelRatio||1, W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  const g = cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
  if (!c || c.cvd.length < 3) return;
  const N = c.cvd.length, s0 = Math.max(1, N-100), n = N-s0;
  const padL=4, padR=52, padT=14, padB=14;
  let lo=Infinity, hi=-Infinity;
  for (let i=s0;i<N;i++) for (const v of [c.cvd[i], c.cvd[i-1], c.e20[i], c.e50[i]]) { if (v<lo) lo=v; if (v>hi) hi=v; }
  if (hi===lo) { hi+=1; lo-=1; }
  const slot = (W-padL-padR)/n, X = i => padL+(i-s0+0.5)*slot, Y = v => padT+(hi-v)/(hi-lo)*(H-padT-padB);
  g.font='10px ui-monospace,monospace'; g.textBaseline='middle';
  for (let k=0;k<=4;k++){ const v=lo+(hi-lo)*k/4, y=Y(v); g.strokeStyle='#24282d'; g.beginPath(); g.moveTo(padL,y); g.lineTo(W-padR,y); g.stroke(); g.fillStyle='#9aa1a9'; g.fillText(fmtVol(v), W-padR+4, y); }
  const bw = Math.max(1, slot*0.7);
  for (let i=s0;i<N;i++){ const o=c.cvd[i-1], cl=c.cvd[i]; g.fillStyle = cl>=o?'#3ddc97':'#ff6470'; const yT=Y(Math.max(o,cl)), yB=Y(Math.min(o,cl)); g.fillRect(X(i)-bw/2, yT, bw, Math.max(1,yB-yT)); }
  const line = (arr,col)=>{ g.strokeStyle=col; g.lineWidth=1.4; g.beginPath(); for (let i=s0;i<N;i++){ const x=X(i), y=Y(arr[i]); i===s0?g.moveTo(x,y):g.lineTo(x,y); } g.stroke(); };
  line(c.e50,'#ff9f1c'); line(c.e20,'#ffd200');
}
function renderCvdInfo(c){ const n=c.cvd.length-1; $('cvdinfo').innerHTML = `CVD ${fmtVol(c.cvd[n])} · EMA20 ${fmtVol(c.e20[n])} · EMA50 ${fmtVol(c.e50[n])}`; }

async function renderMtf(token) {
  const ivs = [['5m','5DK'],['15m','15DK'],['1h','1SA'],['4h','4SA'],['1d','GÜN']];
  const out = {};
  await Promise.all(ivs.map(async ([iv]) => { try { out[iv] = cvdSeries(await getKlines(token.full, iv, 300)); } catch(e){ out[iv]=null; } }));
  let h = '<tr><th></th>' + ivs.map(x=>`<th>${x[1]}</th>`).join('') + '</tr>';
  h += '<tr><td class="lbl">FAZ</td>' + ivs.map(([iv]) => {
    const c = out[iv]; if (!c) return '<td class="na">—</td>';
    const n = c.cvd.length-1, b = c.cvd[n]>c.e20[n]&&c.e20[n]>c.e50[n], s = c.cvd[n]<c.e20[n]&&c.e20[n]<c.e50[n];
    return `<td class="${b?'p':s?'n':'na'}">${b?'BİRİKİM':s?'DAĞITIM':'—'}</td>`;
  }).join('') + '</tr>';
  $('mtf').innerHTML = h;
}

async function loadChain(token) {
  if (!token.chainId || !token.contract) { $('chain').innerHTML = '<tr><td class="wide na" colspan="4">Kontrat bilgisi yok</td></tr>'; return; }
  const q = new URLSearchParams({chainId:token.chainId, contractAddress:token.contract}).toString();
  let data = null;
  for (const h of ['https://web3.binance.com','https://www.binance.com']) {
    try { const r = await fetch(`${h}/bapi/defi/v4/public/wallet-direct/buw/wallet/market/token/dynamic/info/ai?${q}`,{cache:'no-store'}); if (!r.ok) continue; const j = await r.json(); if (j && j.data) { data = j.data; break; } } catch {}
  }
  if (!data) { $('chain').innerHTML = '<tr><td class="wide na" colspan="4">Zincir üstü veri alınamadı</td></tr>'; return; }
  const df = n => { const k=Object.keys(data).find(x=>x.toLowerCase()===n.toLowerCase()); if (k==null) return null; const v=+data[k]; return Number.isFinite(v)?v:null; };
  let h = '<tr><th>PENCERE</th><th>ALIŞ</th><th>SATIŞ</th><th>NET</th></tr>';
  [['5m','5 DK'],['1h','1 SA'],['4h','4 SA'],['24h','24 SA']].forEach(([w,lab]) => {
    const buy=df('volume'+w+'Buy'), sell=df('volume'+w+'Sell');
    const net = buy!=null&&sell!=null ? buy-sell : null;
    const tot = buy!=null&&sell!=null ? buy+sell : df('volume'+w);
    h += `<tr><td>${lab}</td><td class="p">${fmtUsd(buy)}</td><td class="n">${fmtUsd(sell)}</td><td class="${cls(pos(net))}">${fmtUsd(net)}${net!=null&&tot>0?'<br><small>'+fmtPct(net/tot*100)+'</small>':''}</td></tr>`;
  });
  $('chain').innerHTML = h;
}

['1m','5m','15m','1h','4h','1d'].forEach(iv => { const o=document.createElement('option'); o.value=iv; o.textContent=iv; $('interval').appendChild(o); });
$('interval').value = localStorage.getItem('iv') || '1h';

const WINS = [1,5,10,14,20,50,100,200];
const MB_IDX = 4;
const AVG_LEN = 20;

let ALL = [];
async function ensureList() {
  if (ALL.length) return;
  try { await ALPHA.load(); ALL = ALPHA.symbols(); }
  catch(e){ $('err').textContent = 'Liste: '+e.message; }
}

/* ==== COIN SEÇİCİ MODAL ==== */
function renderPickList() {
  const q = up($('pickSearch').value).replace(/\s+/g,'');
  if (!ALL.length) { $('pickList').innerHTML = '<div class="pickitem na">Liste yükleniyor…</div>'; return; }
  let list = !q ? ALL.slice(0,80) : ALL.filter(t => t.base.includes(q) || up(t.name).includes(q) || t.id===q || t.full.includes(q)).slice(0,80);
  if (!list.length) { $('pickList').innerHTML = '<div class="pickitem na">Eşleşme yok</div>'; return; }
  $('pickList').innerHTML = list.map(t => `<div class="pickitem" data-b="${t.base}"><b>${t.base}</b> <small>${t.name||''} · ${t.full}</small></div>`).join('');
}
async function openPicker() {
  $('pickModal').hidden = false;
  $('pickSearch').value = '';
  renderPickList();
  if (!ALL.length) {
    await ensureList();
    renderPickList();
  }
  setTimeout(() => $('pickSearch').focus(), 150);
}
function closePicker() { $('pickModal').hidden = true; }

$('pickBtn').addEventListener('click', openPicker);
$('pickClose').addEventListener('click', closePicker);
$('pickSearch').addEventListener('input', renderPickList);
$('pickList').addEventListener('click', e => {
  const item = e.target.closest('.pickitem[data-b]');
  if (!item) return;
  const b = item.dataset.b;
  $('symbol').value = b;
  $('pickBtn').textContent = b + ' ▾';
  closePicker();
  run();
});
$('pickModal').addEventListener('click', e => { if (e.target === $('pickModal')) closePicker(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePicker(); });

/* ==== VERİ YÜKLE ==== */
async function run() {
  const input = $('symbol').value.trim(); if (!input) return;
  await ensureList();
  const tok = ALPHA.resolve(input);
  if (!tok) { $('err').textContent = 'Alpha listesinde bulunamadı: '+input; return; }
  $('err').textContent = '';
  const iv = $('interval').value;
  try {
    const d = await compute(tok, iv, WINS, MB_IDX, AVG_LEN);
    render(d);
    renderMtf(tok).catch(()=>{});
    loadChain(tok).catch(()=>{});
  } catch (e) { $('err').textContent = e.message; }
}

$('interval').addEventListener('change', () => { localStorage.setItem('iv', $('interval').value); run(); });

setInterval(() => { $('clock').textContent = new Date().toLocaleTimeString('tr-TR'); }, 1000);

ensureList().then(() => {
  if (ALPHA.resolve('PEPE')) {
    $('symbol').value = 'PEPE';
    $('pickBtn').textContent = 'PEPE ▾';
    run();
  }
});
</script>
</body>
</html>
