<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0c10">
<title>EMDUS Alpha · Takas</title>
<style>
:root{--bg:#0b0c0e;--panel:#15171a;--alt:#1a1d21;--line:#24282d;--frame:#2a2e33;--fg:#e8eaed;--sub:#9aa1a9;--amb:#ffa21a;--g:#3ddc97;--r:#ff6470}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;font-variant-numeric:tabular-nums}
main{max-width:520px;margin:0 auto;padding:14px 12px}
header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
h1{font-size:15px;margin:0;letter-spacing:.04em;color:var(--amb)}
.clock{font-size:12px;color:var(--fg)}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.controls label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.06em}
select,input{background:var(--panel);color:var(--fg);border:1px solid var(--frame);border-radius:3px;padding:8px;font:inherit;font-size:16px;width:100%}
.sugg{max-height:280px;overflow-y:auto;background:var(--panel);border:1px solid var(--frame);border-radius:3px;grid-column:1/-1}
.sugg .sg{padding:10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.sugg .sg:hover{background:var(--alt)}
.sugg .sg span{color:var(--sub);font-size:11px;margin-left:6px}
.err{color:var(--r);margin:10px 0;white-space:pre-wrap}
.box{background:var(--panel);border:1px solid var(--frame);margin-bottom:12px}
.band{background:var(--amb);color:#111;font-weight:800;padding:5px 9px;font-size:12px;letter-spacing:.08em;display:flex;justify-content:space-between}
.band #price{font-weight:400;font-size:11px}
table{width:100%;border-collapse:collapse}
th{color:var(--sub);font-weight:500;font-size:10.5px;letter-spacing:.08em;text-align:right;padding:5px 9px}
td{padding:4px 9px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tbody tr:nth-child(even){background:var(--alt)}
.p{color:var(--g)} .n{color:var(--r)} .na{color:var(--sub)}
.lbl{color:var(--sub);letter-spacing:.04em}
.wide{text-align:center!important}
.src{color:var(--sub);font-size:10.5px;letter-spacing:.1em;text-align:center;padding:5px 8px;line-height:1.5}
#cvd{display:block;width:100%;height:220px}
.cvdinfo{font-size:12px;color:var(--sub);padding:6px 9px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<header><h1>EMDUS ALPHA · TAKAS</h1><span class="clock" id="clock">--:--:--</span></header>
<div class="controls">
  <label>Coin <input id="symbol" placeholder="PEPE, 175, ALPHA_175USDT" autocomplete="off" spellcheck="false"></label>
  <label>Zaman dilimi <select id="interval"></select></label>
  <div id="sugg" class="sugg" hidden></div>
</div>
<div id="err" class="err"></div>
<div class="box">
  <div class="band"><span>TAKAS</span><span id="price"></span></div>
  <table id="tbl"><tr><td class="wide na" colspan="4">Coin seçin</td></tr></table>
  <table id="supply"></table>
  <div id="src" class="src"></div>
</div>
<div class="box">
  <div class="band"><span>CVD · EMA20/50</span></div>
  <canvas id="cvd"></canvas>
  <div id="cvdinfo" class="cvdinfo"></div>
  <table id="mtf"><tr><td class="wide na" colspan="6">—</td></tr></table>
</div>
<div class="box">
  <div class="band"><span>ALPHA · ZİNCİR ÜSTÜ</span></div>
  <table id="chain"><tr><td class="wide na" colspan="4">…</td></tr></table>
</div>
</main>
<script type="module">
import { AlphaRegistry } from './alpha.js';

const $ = id => document.getElementById(id);
const up = s => String(s||'').toLocaleUpperCase('en-US').replace(/İ/g,'I');
const fmtVol = x => { if (x==null || Number.isNaN(x)) return '—'; const a=Math.abs(x), r1=y=>(Math.round(y*10)/10).toFixed(1).replace(/\.?0+$/,''); if(a>=1e9)return r1(x/1e9)+'B'; if(a>=1e6)return r1(x/1e6)+'M'; if(a>=1e3)return r1(x/1e3)+'K'; return r1(x); };
const fmtPct = x => x==null ? '—' : (Math.round(x*10)/10)+'%';
const cls = p => p==null ? 'na' : p ? 'p' : 'n';
const pos = x => x==null ? null : x>=0;
const fmtUsd = x => x==null ? '—' : (x<0?'-$':'$')+fmtVol(Math.abs(x));

const ALPHA = new AlphaRegistry({ storage: { get: k=>localStorage.getItem(k), set:(k,v)=>localStorage.setItem(k,v) } });

const HOST = 'https://www.binance.com';
async function getKlines(full, interval, limit=500) {
  const url = `${HOST}/bapi/defi/v1/public/alpha-trade/klines?symbol=${encodeURIComponent(full)}&interval=${interval}&limit=${limit}`;
  const r = await fetch(url, {cache:'no-store'});
  if (!r.ok) throw new Error('Kline: HTTP '+r.status);
  const j = await r.json();
  if (!j || j.success === false) throw new Error('Kline: '+((j&&j.message)||'yanıt geçersiz'));
  const arr = Array.isArray(j.data) ? j.data : (Array.isArray(j) ? j : []);
  return arr.map(k => ({ t:+k[0], o:+k[1], h:+k[2], l:+k[3], c:+k[4], v:+k[5], tb:+k[9] }));
}

function windowStats(deltas, vols, n) {
  if (n<=0 || n>deltas.length) return [null,null,null];
  let total=0, mx=null, vsum=0;
  for (let i=0;i<n;i++){ total+=deltas[i]; vsum+=vols[i]; if (mx===null||total>mx) mx=total; }
  return [total, mx, vsum>0 ? total/vsum*100 : 0];
}
function emaArr(x,n){ const a=2/(n+1), o=new Array(x.length); for(let i=0;i<x.length;i++) o[i]=i===0?x[0]:a*x[i]+(1-a)*o[i-1]; return o; }
function cvdSeries(bars){ const cvd=[]; let s=0; bars.forEach(b=>{ s+=2*b.tb-b.v; cvd.push(s); }); return { t:bars.map(b=>b.t), cvd, e20:emaArr(cvd,20), e50:emaArr(cvd,50) }; }

async function compute(token, interval, wins) {
  const bars = await getKlines(token.full, interval, 500);
  if (!bars.length) throw new Error('Bu coin için '+interval+' verisi yok.');
  const br = bars.slice().reverse();
  const vols = br.map(b=>b.v), deltas = br.map(b=>2*b.tb-b.v);
  const rows = wins.map(n => { const [t,m,a]=windowStats(deltas,vols,n); return {bar:String(n),takas:t,max:m,ad:a}; });
  return { token, price: bars[bars.length-1].c, rows, cvd: cvdSeries(bars), nbars: bars.length };
}

function render(d) {
  let h = '<tr><th>BAR</th><th>TAKAS</th><th>MAX</th><th>AD%</th></tr>';
  d.rows.forEach(r => { h += `<tr><td>${r.bar}</td><td class="${cls(pos(r.takas))}">${fmtVol(r.takas)}</td><td class="${cls(pos(r.max))}">${fmtVol(r.max)}</td><td class="${cls(pos(r.ad))}">${fmtPct(r.ad)}</td></tr>`; });
  $('tbl').innerHTML = h;
  let s = '';
  if (d.token.supply) {
    const mx = d.rows[d.rows.length-1]?.max;
    s += `<tr><td class="lbl" colspan="3">Dolaşımdaki miktar</td><td>${fmtVol(d.token.supply)} ${d.token.base}</td></tr>`;
    if (mx != null) s += `<tr><td class="lbl" colspan="3">Birikim (MAX/dolaşım)</td><td class="${cls(pos(mx))}">${fmtPct(mx/d.token.supply*100)}</td></tr>`;
  }
  $('supply').innerHTML = s;
  $('src').textContent = `GERÇEK VERİ AKIŞI: ${d.nbars} BAR · ${d.token.full}`;
  $('price').textContent = d.token.base + ' · ' + d.price;
  drawCvd(d.cvd); renderCvdInfo(d.cvd);
}

function drawCvd(c) {
  const cv = $('cvd'), dpr = window.devicePixelRatio||1, W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  const g = cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
  if (!c || c.cvd.length < 3) return;
  const N = c.cvd.length, s0 = Math.max(1, N-100), n = N-s0;
  const padL=4, padR=52, padT=14, padB=14;
  let lo=Infinity, hi=-Infinity;
  for (let i=s0;i<N;i++) for (const v of [c.cvd[i], c.cvd[i-1], c.e20[i], c.e50[i]]) { if (v<lo) lo=v; if (v>hi) hi=v; }
  if (hi===lo) { hi+=1; lo-=1; }
  const slot = (W-padL-padR)/n, X = i => padL+(i-s0+0.5)*slot, Y = v => padT+(hi-v)/(hi-lo)*(H-padT-padB);
  g.font='10px ui-monospace,monospace'; g.textBaseline='middle';
  for (let k=0;k<=4;k++){ const v=lo+(hi-lo)*k/4, y=Y(v); g.strokeStyle='#24282d'; g.beginPath(); g.moveTo(padL,y); g.lineTo(W-padR,y); g.stroke(); g.fillStyle='#9aa1a9'; g.fillText(fmtVol(v), W-padR+4, y); }
  const bw = Math.max(1, slot*0.7);
  for (let i=s0;i<N;i++){ const o=c.cvd[i-1], cl=c.cvd[i]; g.fillStyle = cl>=o?'#3ddc97':'#ff6470'; const yT=Y(Math.max(o,cl)), yB=Y(Math.min(o,cl)); g.fillRect(X(i)-bw/2, yT, bw, Math.max(1,yB-yT)); }
  const line = (arr,col)=>{ g.strokeStyle=col; g.lineWidth=1.4; g.beginPath(); for (let i=s0;i<N;i++){ const x=X(i), y=Y(arr[i]); i===s0?g.moveTo(x,y):g.lineTo(x,y); } g.stroke(); };
  line(c.e50,'#ff9f1c'); line(c.e20,'#ffd200');
}
function renderCvdInfo(c){ const n=c.cvd.length-1; $('cvdinfo').innerHTML = `CVD ${fmtVol(c.cvd[n])} · EMA20 ${fmtVol(c.e20[n])} · EMA50 ${fmtVol(c.e50[n])}`; }

async function renderMtf(token) {
  const ivs = [['5m','5DK'],['15m','15DK'],['1h','1SA'],['4h','4SA'],['1d','GÜN']];
  const out = {};
  await Promise.all(ivs.map(async ([iv]) => { try { out[iv] = cvdSeries(await getKlines(token.full, iv, 300)); } catch(e){ out[iv]=null; } }));
  let h = '<tr><th></th>' + ivs.map(x=>`<th>${x[1]}</th>`).join('') + '</tr>';
  h += '<tr><td class="lbl">FAZ</td>' + ivs.map(([iv]) => {
    const c = out[iv]; if (!c) return '<td class="na">—</td>';
    const n = c.cvd.length-1, b = c.cvd[n]>c.e20[n]&&c.e20[n]>c.e50[n], s = c.cvd[n]<c.e20[n]&&c.e20[n]<c.e50[n];
    return `<td class="${b?'p':s?'n':'na'}">${b?'BİRİKİM':s?'DAĞITIM':'—'}</td>`;
  }).join('') + '</tr>';
  $('mtf').innerHTML = h;
}

async function loadChain(token) {
  if (!token.chainId || !token.contract) { $('chain').innerHTML = '<tr><td class="wide na" colspan="4">Kontrat bilgisi yok</td></tr>'; return; }
  const q = new URLSearchParams({chainId:token.chainId, contractAddress:token.contract}).toString();
  let data = null;
  for (const h of ['https://web3.binance.com','https://www.binance.com']) {
    try { const r = await fetch(`${h}/bapi/defi/v4/public/wallet-direct/buw/wallet/market/token/dynamic/info/ai?${q}`,{cache:'no-store'}); if (!r.ok) continue; const j = await r.json(); if (j && j.data) { data = j.data; break; } } catch {}
  }
  if (!data) { $('chain').innerHTML = '<tr><td class="wide na" colspan="4">Zincir üstü veri alınamadı</td></tr>'; return; }
  const df = n => { const k=Object.keys(data).find(x=>x.toLowerCase()===n.toLowerCase()); if (k==null) return null; const v=+data[k]; return Number.isFinite(v)?v:null; };
  let h = '<tr><th>PENCERE</th><th>ALIŞ</th><th>SATIŞ</th><th>NET</th></tr>';
  [['5m','5 DK'],['1h','1 SA'],['4h','4 SA'],['24h','24 SA']].forEach(([w,lab]) => {
    const buy=df('volume'+w+'Buy'), sell=df('volume'+w+'Sell');
    const net = buy!=null&&sell!=null ? buy-sell : null;
    const tot = buy!=null&&sell!=null ? buy+sell : df('volume'+w);
    h += `<tr><td>${lab}</td><td class="p">${fmtUsd(buy)}</td><td class="n">${fmtUsd(sell)}</td><td class="${cls(pos(net))}">${fmtUsd(net)}${net!=null&&tot>0?'<br><small>'+fmtPct(net/tot*100)+'</small>':''}</td></tr>`;
  });
  $('chain').innerHTML = h;
}

['1m','5m','15m','1h','4h','1d'].forEach(iv => { const o=document.createElement('option'); o.value=iv; o.textContent=iv; $('interval').appendChild(o); });
$('interval').value = localStorage.getItem('iv') || '1h';

let ALL = [], PREV = '';
async function ensureList() { try { await ALPHA.load(); ALL = ALPHA.symbols(); } catch(e){ $('err').textContent = 'Liste: '+e.message; } }

function showSugg() {
  const q = up($('symbol').value).replace(/\s+/g,''), box = $('sugg');
  if (!ALL.length) { box.innerHTML = '<div class="sg na">Liste yükleniyor…</div>'; box.hidden=false; return; }
  let list = !q ? ALL.slice(0,40) : ALL.filter(t => t.base.includes(q) || up(t.name).includes(q) || t.id===q || t.full.includes(q)).slice(0,40);
  if (!list.length) { box.innerHTML = '<div class="sg na">Eşleşme yok</div>'; box.hidden=false; return; }
  box.innerHTML = list.map(t => `<div class="sg" data-b="${t.base}">${t.base} <span>${t.name||''} · ${t.full}</span></div>`).join('');
  box.hidden = false;
}

async function run() {
  const input = $('symbol').value.trim(); if (!input) return;
  await ensureList();
  const tok = ALPHA.resolve(input);
  if (!tok) { $('err').textContent = 'Alpha listesinde bulunamadı: '+input; return; }
  $('err').textContent = '';
  const iv = $('interval').value;
  try {
    const d = await compute(tok, iv, [1,2,5,14,20,50,100,200]);
    render(d);
    renderMtf(tok).catch(()=>{});
    loadChain(tok).catch(()=>{});
  } catch (e) { $('err').textContent = e.message; }
}

$('symbol').addEventListener('focus', () => { PREV=$('symbol').value; $('symbol').value=''; ensureList().then(showSugg); });
$('symbol').addEventListener('input', showSugg);
$('symbol').addEventListener('blur', () => setTimeout(() => { $('sugg').hidden=true; if(!$('symbol').value.trim()) $('symbol').value=PREV; }, 400));
$('sugg').addEventListener('click', e => { const sg = e.target.closest('.sg[data-b]'); if(!sg) return; $('symbol').value=sg.dataset.b; $('sugg').hidden=true; run(); });
$('symbol').addEventListener('change', run);
$('interval').addEventListener('change', () => { localStorage.setItem('iv', $('interval').value); run(); });

setInterval(() => { $('clock').textContent = new Date().toLocaleTimeString('tr-TR'); }, 1000);

ensureList().then(() => { if (ALPHA.resolve('PEPE')) { $('symbol').value='PEPE'; run(); } });
</script>
</body>
</html>
